<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Abençoar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen text-slate-100">

<div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-500 tracking-tight">PROJETO ABENÇOAR</h1>
        <p class="text-slate-400 mt-2 text-sm">Controle de Acesso Administrativo & TI</p>
    </div>

    <!-- Alerta de Erro -->
    <div th:if="${erro}" class="bg-red-500/20 border border-red-500 text-red-200 p-3 rounded-lg text-sm mb-6 text-center">
        <span th:text="${erro}"></span>
    </div>

    <form th:action="@{/login}" method="POST" class="space-y-6">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">E-mail Corporativo</label>
            <input type="email" name="email" required placeholder="exemplo@projeto.com"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Senha de Acesso</label>
            <input type="password" name="senha" required placeholder="••••••••"
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
            Entrar no Sistema
        </button>
    </form>
</div>

</body>
</html>

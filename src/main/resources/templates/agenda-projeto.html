<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projeto Abençoar - Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        h2 { color: #2c3e50; text-align: center; font-weight: bold; margin-top: 20px; }
        .card { border: none; border-radius: 15px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navigation :: header}"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📅 Novo Atendimento - Triagem Inicial</h2>
        <a th:href="@{/agenda/gestao}" class="btn btn-dark shadow-sm fw-bold px-4 py-2">
            📋 PAINEL DE GESTÃO ESTRATÉGICA
        </a>
    </div>
    <hr class="mb-5">

    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 p-3 mb-4" role="alert">
        <strong th:text="${mensagemSucesso}">Sucesso</strong>
    </div>
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 p-3 mb-4" role="alert">
        <strong th:text="${mensagemErro}">Erro</strong>
    </div>

    <div class="card shadow-lg mx-auto" style="max-width: 600px;">
        <div class="card-header bg-dark text-white fw-bold text-center fs-5 py-3">🚀 Iniciar Novo Atendimento</div>
        <div class="card-body p-5">

            <form th:action="@{/agenda/cadastrar-e-agendar}" method="post" class="row g-4 justify-content-center">

                <div class="col-12">
                    <label class="form-label fw-bold fs-5 text-secondary">Qual a Especialidade desejada?</label>
                    <select name="especialidadeNome" class="form-select form-select-lg" required>
                        <option value="" disabled selected>Escolha a modalidade...</option>
                        <option th:each="e : ${especialidades}" th:value="${e.nome}" th:text="${e.nome}"></option>
                    </select>
                </div>

                <div class="col-12 text-center mt-5">
                    <button type="submit" class="btn btn-primary btn-lg w-100 py-3 shadow fw-bold fs-5">
                        PROSSEGUIR PARA O CADASTRO ➔
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<div th:if="${imprimirContratoId}" id="gatilhoContrato" th:data-id="${imprimirContratoId}"></div>

<script th:if="${imprimirContratoId}">
    window.addEventListener('DOMContentLoaded', (event) => {
        const gatilho = document.getElementById('gatilhoContrato');
        if (gatilho) {
            const beneficiarioId = gatilho.getAttribute('data-id');
            const link = document.createElement('a');
            link.href = '/beneficiarios/contrato/' + beneficiarioId;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });
</script>

<script>
    setTimeout(function() {
        let alertas = document.querySelectorAll('.alert');
        alertas.forEach(alerta => {
            alerta.style.transition = "opacity 0.5s ease";
            alerta.style.opacity = "0";
            setTimeout(() => alerta.remove(), 500);
        });
    }, 4000);
</script>
</body>
</html>
